<g font-family="serif" fill="#242424"><text x="413" y="300" font-size="29">Espaço para escrever</text><text x="413" y="352" font-size="18">Uma interface tranquila, com identidade.</text><text x="413" y="386" font-size="18">O azul-marinho fica na moldura. Cinzas azulados</text><text x="413" y="414" font-size="18">organizam as ferramentas e dão contraste à página.</text><text x="413" y="470" font-size="18">A folha continua branca, e as cores e os estilos</text><text x="413" y="498" font-size="18">do seu documento permanecem como você escolheu.</text></g>
<rect x="24" y="754" width="1152" height="28" fill="#dadce3"/><text x="42" y="773" font-size="12" fill="#4c5680">Página branca · Interface adaptada de Tokyo Night Light / Day</text>
<text x="600" y="806" text-anchor="middle" font-size="13" fill="#4c5680">Prévia ilustrativa da paleta — não é captura do ONLYOFFICE.</text>
